name: Publish

# Builds the aggregated dist/plugins/index.json and dist/themes/index.json
# from plugins/*/entry.json and themes/*/entry.json, and commits them back to
# main. AList admins point a plugin/theme source's index URL at the raw file
# on this branch:
#
#   https://raw.githubusercontent.com/AlistGo/alist-registry/main/dist/plugins/index.json
#   https://raw.githubusercontent.com/AlistGo/alist-registry/main/dist/themes/index.json
#
# Committing the generated index back to main (rather than e.g. GitHub Pages)
# was chosen so the published URL needs no extra repository configuration
# (Pages enablement, custom domain, environment approval) beyond what a
# fresh clone of this repo already has, and raw.githubusercontent.com already
# gives a CDN-cached, stable-by-path URL -- exactly what FetchIndex/
# FetchCatalog need (a plain HTTPS GET, no git tooling on the client side).
# The tradeoff is a bot commit on every merge; that is judged acceptable for
# a low-churn index like this one.
#
# Never validates without --base-ref: an entry that would be a version
# rollback compared to what's already on main must not be published, even if
# it slipped past a stale PR check.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate before publishing
        run: python3 scripts/validate.py

      - name: Build aggregated index
        run: python3 scripts/build_index.py

      - name: Commit dist/ if changed
        run: |
          git config user.name "alist-registry-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "no index changes to publish"
            exit 0
          fi
          git commit -m "chore(index): publish aggregated plugin/theme index"
          git push
